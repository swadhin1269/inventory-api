name: "complete ci/cd workflow"

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Build
          path: dist/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test

  quality:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Quality Check
        run: echo "Running quality checks..."
      - name: Lint Check
        run: echo "Running lint checks..."
      - name: Security Check
        run: |
          echo "Running security checks..."
          exit 1 # Simulating a failure for demonstration purposes
      - name: Dependency Check
        if: ${{ always() }}
        run: echo "Running dependency checks..."
      - name: Code Coverage Check
        if: ${{ always() }}
        run: echo "Running code coverage checks..."
      - name: Failure Check
        if: ${{ failure() }}
        run: echo "One or more checks failed. Please review the logs for details."

  deploy:
    needs: [build, test, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: Build
          path: dist/
      - name: Deploy
        run: ls -la dist/