name: 1-8 module practice

on:
  push:
    branches:
      - feature/linux-sys

env:
  APP_NAME: inventory-api

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.phase1.outputs.version }}

    steps:
      - name: Phase 1
        id: phase1
        run: |
          echo "Application: ${{ env.APP_NAME }}"
          echo "Repository: ${{ github.repository }}"
          echo "Runner OS #: ${{ runner.os }}"
          echo "Building inventory-api..."

  test:
    needs: build
    if: ${{ github.ref_name == 'master' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: phase 2
        run: |
          echo "Testing inventory-api version: 2.5.0"

  deploy:
    needs: build
    strategy:
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    env:
      AWS_TOKEN: ${{ secrets.AWS_TOKEN }}

    environment: production

    steps:
      - name: Node versions check
        run: |
          echo "node version: ${{ matrix.node }}"
          echo "os: ${{ runner.os }}"

      - name: Deploy to AWS
        if: ${{ matrix.node == 22 }}
        run: |
          echo "Deploying inventory-api version: ${{ needs.build.outputs.version }} to AWS"